[package]
name = "pdfcraft-smtp"
description = "Deliver an email over SMTP (RFC 5321), with STARTTLS and implicit TLS: no workspace dependency"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]

# Transport security (RFC 3207 `STARTTLS`, RFC 8314 implicit TLS) is the workspace's existing
# rustls stack, with the OS's own trusted roots — no bundled root list. A browser build has no
# sockets, so the dependency, the handshake and the socket-level tests exist only on native
# targets; there `starttls`/`tls` are named and refused rather than silently sent in the clear.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
